name: Build-And-Release-Exe

on:
  push:
    tags:
      - "**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    # Windows is currently the only platform this action supports
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      # 与本地实测环境保持一致（Python 3.13 + Node 22 均已验证可构建）。
      PYTHON_VERSION: "3.13"
      NODE_VERSION: "22"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: "x64"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 运行时依赖 + 测试依赖 + 打包工具分开装，避免把开发工具混进运行时环境。
      # 注意 requirements-dev.txt 是必须的：TestClient 依赖 httpx，它不在运行时闭包里，
      # 少了它「跑单元测试」会直接 RuntimeError。
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-build.txt

      # 前端必须在打包之前构建（main.py 依赖 frontend/out）。
      # 也放在跑测试之前：有一条用例会验证「真实前端产物能被服务」，
      # 没有构建产物时它会 skip，先构建就能在 CI 里真正跑到。
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          npm run export

      # 单元测试：B21（引导页 ReferenceError 导致白屏）、B33（概览页崩溃）、
      # B34（后端死循环）这类回归全靠这一步拦截。
      - name: Run unit tests
        run: python -m unittest tests.test_coyote -v

      # 用仓库自己的 spec 打包，保证 CI 产物与本地 `python -m PyInstaller build_local.spec` 一致
      - name: Build exe (PyInstaller)
        run: python -m PyInstaller build_local.spec --noconfirm

      # 产物完整性校验：体积异常通常意味着构建损坏（曾出现 95MB 的损坏产物：
      # python313.dll 载荷坏了、进程起不来），或把 PyQt5/matplotlib 等无关重库打了进去。
      # 干净环境下的正常体积约 19-20MB（Python 3.13 + PyInstaller 6.19）。
      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = "dist/osc-toys.exe"
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "osc-toys.exe = $mb MB"
          if ($mb -lt 15 -or $mb -gt 40) {
            throw "体积异常（$mb MB）：预期 15-40 MB（干净环境约 19-20MB）。过大通常是打包进了无关重库（例如开发机装了 pywin32 会被 logging.handlers 的惰性 import 拖进来），过小通常是构建损坏。"
          }
          # 用字节读取再转 ASCII 搜索：Select-String 读二进制文件不可靠
          $chunk = (Select-String -Path "frontend/out/index.html" -Pattern "_app-[a-z0-9]+\.js" -AllMatches).Matches[0].Value
          Write-Host "前端 chunk: $chunk"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if (-not $text.Contains($chunk)) {
            throw "exe 内没有找到最新的前端 chunk $chunk，前端未被打进包里"
          }
          Write-Host "exe 内嵌前端校验通过"

      # 冒烟测试：真的把 exe 跑起来，确认 38080 能响应且接口可用。
      # B20（重建的 exe 启动即挂死、38080 无监听、无任何输出）当时就是因为没有这一步才流出去的。
      - name: Smoke test exe
        shell: pwsh
        run: |
          # 必须让 127.0.0.1 绕过系统代理，否则请求会被代理拦截返回 502
          # （本地验证时踩过：不设 NO_PROXY 时 /health 返回 502 Bad Gateway）
          $env:NO_PROXY = "127.0.0.1,localhost"
          $p = Start-Process -FilePath "dist/osc-toys.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { break }
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:38080/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              $code = if ($p.HasExited) { "进程已退出，exit code = $($p.ExitCode)" } else { "进程存活但 60s 内 /health 无响应" }
              throw "exe 冒烟测试失败：$code"
            }
            foreach ($path in @("/index.html", "/coyote", "/api/coyote/aggregate_status", "/api/coyote/patterns")) {
              $r = Invoke-WebRequest "http://127.0.0.1:38080$path" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -ne 200) { throw "GET $path 返回 $($r.StatusCode)" }
              Write-Host "OK $path"
            }
            $s = Invoke-WebRequest "http://127.0.0.1:38080/settings" -UseBasicParsing -TimeoutSec 5 | Select-Object -ExpandProperty Content
            if ($s -notmatch "coyote_connect_budget") { throw "/settings 缺少 coyote_connect_budget" }
            Write-Host "OK /settings"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      # 打成与本地 release_windows_x64.zip 相同的布局（文件在 zip 根目录，不带外层文件夹）
      - name: Package release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path osc-toys | Out-Null
          New-Item -ItemType Directory -Force -Path osc-toys/frontend | Out-Null
          Copy-Item dist/osc-toys.exe osc-toys/osc-toys.exe
          Copy-Item settings.yaml osc-toys/settings.yaml
          Copy-Item -Recurse -Force frontend/out osc-toys/frontend/out
          Copy-Item -Recurse -Force data osc-toys/data
          Compress-Archive -Path "osc-toys/*" -DestinationPath release_windows_x64.zip -Force
          Write-Host "zip 大小: $([math]::Round((Get-Item release_windows_x64.zip).Length / 1MB, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_windows_x64
          path: release_windows_x64.zip

      # 手动触发（workflow_dispatch）时没有 tag，不该去建 release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release_windows_x64.zip
